<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- Candlestick chart elements -->
  <!-- Candle 1 (Green/Blue) -->
  <line x1="120" y1="200" x2="120" y2="340" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <rect x="100" y="240" width="40" height="70" rx="6" fill="#3b82f6"/>
  
  <!-- Candle 2 (Rose/Red) -->
  <line x1="200" y1="140" x2="200" y2="380" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <rect x="180" y="180" width="40" height="130" rx="6" fill="url(#roseGrad)"/>

  <!-- Candle 3 (Rose/Red Big Breakout) -->
  <line x1="280" y1="90" x2="280" y2="320" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <rect x="260" y="120" width="40" height="150" rx="6" fill="url(#roseGrad)"/>

  <!-- Trend Line with Arrow -->
  <path d="M 80 340 Q 180 270, 270 200 T 420 100" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  <polygon points="435,85 410,120 400,95" fill="#fbbf24"/>

  <!-- 24H Badge -->
  <rect x="300" y="340" width="130" height="64" rx="20" fill="#e11d48"/>
  <text x="365" y="383" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">24H</text>
  
  <!-- Sub text -->
  <text x="256" y="450" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="2">BITHUMB BOT</text>
</svg>
